# Serviço do formulário de contato do site GETA (Cloudflare Worker).
# Publicar:  npx wrangler deploy     (dentro desta pasta)
name = "geta-contato"
main = "src/index.js"
compatibility_date = "2026-11-01"
workers_dev = true

[vars]
# Sites que podem enviar o formulário (separados por vírgula)
ALLOWED_ORIGINS = "https://getaengenharia.com.br,https://www.getaengenharia.com.br,https://geta-site.pages.dev,https://felipe77-ch.github.io,http://localhost:5500"
# Remetente dos e-mails (domínio verificado no Resend e, para o aviso, com Email Routing ativo).
# Quem RECEBE o aviso não fica aqui (este repositório é público):
#   npx wrangler secret put CONTACT_TO
CONTACT_FROM = "site@getaengenharia.com.br"

[[d1_databases]]
binding = "DB"
database_name = "geta-contatos"
database_id = "5e7c715a-3287-4c43-bb73-17edd492d66a"

# Aviso por e-mail: ativar quando getaengenharia.com.br estiver ativo no Cloudflare,
# com Email Routing ligado e o e-mail de destino verificado (Email Routing → Destination addresses).
# [[send_email]]
# name = "EMAIL"

# Confirmação à pessoa (e aviso, se não houver Email Routing) pelo Resend:
#   npx wrangler secret put RESEND_API_KEY
# Remetente da confirmação (opcional, e-mail institucional; respostas vão para ele):
#   npx wrangler secret put CONFIRM_FROM

# Limite de envios por IP: 5 por minuto (o IP só é usado para contar, não é guardado)
[[ratelimits]]
name = "LIMITE"
namespace_id = "1001"
simple = { limit = 5, period = 60 }

# Tarefa diária (06:00 UTC): apaga contatos com mais de 2 anos (prazo da política de privacidade)
[triggers]
crons = ["0 6 * * *"]

# Anti-spam Turnstile (opcional): npx wrangler secret put TURNSTILE_SECRET
