<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Página não encontrada | GETA Engenharia</title>
<link rel="icon" href="/favicon.ico" sizes="48x48">
<link rel="icon" href="/img/favicon-192.png" type="image/png" sizes="192x192">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/site.webmanifest">
<meta name="theme-color" content="#0b175e">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/portfolio.css?v=20261127l">
<link rel="stylesheet" href="/assets/mega.css?v=20261127l">
<style>
  .nf{min-height:70vh;display:flex;align-items:center;padding:140px 0 80px;text-align:center}
  .nf .wrap{max-width:640px}
  .nf b{display:block;font:800 clamp(72px,12vw,120px)/1 var(--display);color:var(--navy)}
  .nf h1{font-size:clamp(24px,3vw,32px);color:var(--navy);margin:14px 0 10px}
  .nf p{color:var(--muted);font-size:16.5px;margin-bottom:26px}
</style>
</head>
<!-- Página de erro 404 (o Cloudflare Pages mostra esta página, com código 404, para endereços que não existem). -->
<body data-page="about" data-root="/" data-title-key="meta.404.title">
<section class="nf">
  <div class="wrap">
    <b>404</b>
    <div data-l="pt"><h1>Página não encontrada</h1><p>O endereço que você procurou não existe ou mudou de lugar.</p><a class="btn" href="/">Voltar ao início</a></div>
    <div data-l="en"><h1>Page not found</h1><p>The address you were looking for does not exist or has moved.</p><a class="btn" href="/?lang=en">Back to home</a></div>
    <div data-l="es"><h1>Página no encontrada</h1><p>La dirección que buscó no existe o cambió de lugar.</p><a class="btn" href="/?lang=es">Volver al inicio</a></div>
  </div>
</section>
<script src="/i18n.js?v=20261128c"></script>
<script src="/cases/cases.js?v=20261127u"></script>
<script src="/assets/mega.js?v=20261127l"></script>
<script src="/assets/portfolio.js?v=20261128c"></script>
<script>
  (function () {
    const mostra = lang => document.querySelectorAll('[data-l]').forEach(el => { el.hidden = el.dataset.l !== lang; });
    I18N.onChange(mostra);
    mostra(I18N.lang);
  })();
</script>
</body>
</html>
